[versions]
agp = "9.4.1"
kotlin = "2.4.20"
compose-bom = "2026.05.00"
activity-compose = "1.13.0"
lifecycle = "2.11.0"
material-icons = "1.7.8"
pleos-vehicle = "2.3.2"
pleos-navihelper = "3.0.5"
pleos-fused-location = "1.1.3"
pleos-tts = "3.3.1"
pleos-stt = "3.3.1"
junit = "4.13.2"

[libraries]
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material-icons = { module = "androidx.compose.material:material-icons-extended", version.ref = "material-icons" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
pleos-vehicle = { module = "ai.pleos.playground:Vehicle", version.ref = "pleos-vehicle" }
pleos-navihelper = { module = "ai.pleos.playground:NaviHelper", version.ref = "pleos-navihelper" }
pleos-fused-location = { module = "ai.pleos.playground:FusedLocation", version.ref = "pleos-fused-location" }
pleos-tts = { module = "ai.pleos.playground:TextToSpeech", version.ref = "pleos-tts" }
pleos-stt = { module = "ai.pleos.playground:SpeechToText", version.ref = "pleos-stt" }
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
